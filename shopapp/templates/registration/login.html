{% extends "base.html" %}

{% load static %}

{% block title %} login {%endblock%}

{% block content %}

<!-- Heading -->
{% if messages %}
{% for message in messages %}
<div class="alert alert-dismissible alert-success">
  <button type="button" class="close text-align center" data-dismiss="alert"> &times;</button>
  <strong class="text-dark" style="text-align:center; padding: 10px 550px 20px"> {{ message }} </strong>
</div>
{% endfor %}
{% endif %}

<h1 style="text-align: center; padding: 30px 300px 20px">LOGIN</h1>

<form style="text-align: center; padding: 10px 550px 20px" method="POST"> {% csrf_token %}
  <div class="form-group">
    <label>Usuario</label>
    <input type="text" class="form-control" name="username" id="username" aria-describedby="emailHelp">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" class="form-control" name="password" id="password">
  </div>
  <button type="submit" class="btn btn-primary">Ingresar</button>
</form>

{% endblock %}
