{% extends "base.html" %}

{% load static %}

{% block title %} CONSULTA DE PRECIO POR FAMILIA {%endblock%}

{% block content %}

{% load humanize %}

<body class="p-4">
  <h2>Catalogo de Familias</h2>

  <div class="row">
    <div class="col-10" style="font-size: 14px">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th class="text-left" scope="col">Familia</th>
          </tr>
        </thead>
        <tbody>
          {% for family in families %}
          <tr>
            <td class="text-left">{{family.name}}</td>
            <td>
              <a href="/consult_prices/family/{{family.id}}" > 
                <button type="button" class="btn btn-primary">Historial</button>
              </a>
            </td>
          </tr>
          {% endfor %}

        </tbody>
      </table>
      <footer>

      </footer>
    </div>
    <div class="col-2 text-center">
    </div>
  </div>

  {% endblock %}
